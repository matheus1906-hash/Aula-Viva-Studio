name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write   # necessário para publicar o instalador na página de Releases
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Auditoria de vulnerabilidades
        continue-on-error: true   # alerta no log sem bloquear a publicação
        run: pip-audit -r requirements.txt
      - name: Testes
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -q
      - name: Build Linux
        if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"; python tools/make_icons.py; Remove-Item Env:QT_QPA_PLATFORM
          pyinstaller packaging/aulaviva.spec --noconfirm --distpath dist --workpath build
          $p = Start-Process dist/AulaVivaStudio/AulaVivaStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Autoteste do executável falhou" }
          choco install innosetup -y --no-progress
          iscc packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AulaVivaStudio-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*Setup*.exe
      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*Setup*.exe
