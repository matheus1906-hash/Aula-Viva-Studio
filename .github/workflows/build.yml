name: build
# Publica automaticamente: a cada envio ao main com uma versão nova em aulaviva/__init__.py,
# compila os instaladores (Windows e Linux), cria a tag vX.Y.Z e a release com os arquivos para download.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write   # necessário para criar a tag e publicar a release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('aulaviva/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION já existe: nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nova versão v$VERSION: será publicada."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Auditoria de vulnerabilidades
        continue-on-error: true   # alerta no log sem bloquear a publicação
        run: pip-audit -r requirements.txt
      - name: Testes
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -q
      - name: Credenciais de login (Google) a partir dos segredos do repositório
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            python -c "import json,os; json.dump({'google': {'client_id': os.environ['GOOGLE_CLIENT_ID'], 'client_secret': os.environ.get('GOOGLE_CLIENT_SECRET','')}}, open('aulaviva/assets/oauth_providers.json','w'))"
            echo "Login com Google habilitado no instalador."
          else
            echo "Segredo GOOGLE_CLIENT_ID não configurado: instalador sem login Google."
          fi
      - name: Build Linux
        if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"; python tools/make_icons.py; Remove-Item Env:QT_QPA_PLATFORM
          pyinstaller packaging/aulaviva.spec --noconfirm --distpath dist --workpath build
          $p = Start-Process dist/AulaVivaStudio/AulaVivaStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Autoteste do executável falhou" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o instalador" }
          Compress-Archive -Path dist/AulaVivaStudio -DestinationPath "dist/AulaVivaStudio-${{ needs.version.outputs.version }}-windows-portatil.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AulaVivaStudio-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*Setup*.exe
            dist/*portatil.zip

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Notas da versão (CHANGELOG)
        run: |
          V="${{ needs.version.outputs.version }}"
          python3 - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]
          ch = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"## " + re.escape(v) + r"\n(.*?)(?=\n## |\Z)", ch, re.S)
          notas = m.group(1).strip() if m else "Veja o CHANGELOG.md."
          open("NOTAS.md", "w", encoding="utf-8").write(
              f"## Novidades\n{notas}\n\n## Como instalar\n"
              f"- **Windows (recomendado):** baixe `AulaVivaStudio-Setup-{v}.exe` e execute.\n"
              f"- **Windows sem instalar:** baixe o `...-windows-portatil.zip`, extraia e abra `AulaVivaStudio.exe`.\n"
              "- **Linux:** baixe `AulaVivaStudio-linux-x86_64.tar.gz`, extraia e rode `./install_linux.sh`.\n\n"
              "O Windows pode mostrar \"O Windows protegeu o computador\" (instalador sem assinatura digital): "
              "clique em *Mais informações > Executar assim mesmo*.\n")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AulaViva Studio ${{ needs.version.outputs.version }}
          body_path: NOTAS.md
          make_latest: true
          files: artefatos/*
