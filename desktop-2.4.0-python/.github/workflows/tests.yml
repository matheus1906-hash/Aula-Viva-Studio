name: tests
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest python-docx==1.2.0 python-pptx==1.0.2
      - name: Testes
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -q
